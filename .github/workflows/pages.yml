name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    # only what ends up on the site; ci.yml checks every push
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "packages/cli/src/**"
      - "packages/cli/package.json"
      - "package.json"
      - "bun.lock"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /labsUI
      NEXT_PUBLIC_SITE_URL: https://kznlabs.github.io/labsUI
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
