name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # build-api.ts runs on Node until oven-sh/bun#39747 ships
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run check-dead-code
      - run: bun run cli:build
      - name: Lint MCP tool definitions
        run: npx -y mcp-tdqs@0.2.0 lint --command "node packages/cli/dist/index.js mcp" --fail-on warning
